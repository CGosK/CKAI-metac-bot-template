name: Offline tests

# Runs the CKAI bot against stand-in models and locally built questions.
# Needs no secrets, calls no LLM or Metaculus API, and publishes nothing.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --with pytest python -m pytest tests -q
